[project]
name = "nakagai-edge"
version = "0.2.6"
description = "Nakagai edge: the connector runtime that holds your broker credentials"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["trading", "brokerage", "mcp", "agent", "credentials"]
# No `License ::` classifier: `license` above is a PEP 639 SPDX expression, and
# modern build backends reject carrying both. Only 3.12 is claimed because only
# 3.12 is what CI runs.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Security",
]
dependencies = [
    # 1.10 is the floor because it is the first release with client-side
    # output-schema validation: ClientSession._validate_tool_result and
    # _tool_output_schemas both arrived in modelcontextprotocol/python-sdk
    # commit 43bb24f6 ("Add structured output support for tool functions",
    # #993), first tagged as v1.10.0. TolerantClientSession overrides both.
    # Below 1.10 neither exists, so the override binds to nothing: no crash,
    # no tolerance, just a broker payload validated by nothing at all.
    "mcp>=1.10",
    "cryptography>=42",
    "httpx>=0.27",
    "jsonschema>=4.26",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://nakag.ai"
Repository = "https://github.com/loubylabs/nakagai-edge"
Issues = "https://github.com/loubylabs/nakagai-edge/issues"

[project.scripts]
nakagai-edge = "nakagai_edge.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nakagai_edge"]

[tool.hatch.build.targets.sdist]
# What ships is a choice, not whatever happened to be tracked. `tests/` and the
# lockfile earn their place (someone building from source can verify it); agent
# scaffolding and CI config do not.
#
# `.claude` still belongs here after the skills moved into the package. It is
# not gitignored, and an sdist build sweeps in untracked files, so this is what
# keeps a developer's local `.claude/worktrees/` and settings out of a release.
# It reads like dead config now that nothing under it is tracked. It is not.
exclude = [".claude", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
