[project]
name = "nakagai-edge"
version = "0.5.6"
description = "Nakagai edge: the connector runtime that holds your broker credentials"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["trading", "brokerage", "mcp", "agent", "credentials"]
# No `License ::` classifier: `license` above is a PEP 639 SPDX expression, and
# modern build backends reject carrying both. Only 3.12 is claimed because only
# 3.12 is what CI runs.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Security",
]
dependencies = [
    # 2.0 is the floor because this package is written against the 2.x API and
    # nothing here still speaks 1.x. edge/runtime.py builds its server as
    # `mcp.server.mcpserver.MCPServer`, which 1.x does not ship at all, and
    # hub.py's TolerantClientSession overrides `ClientSession
    # .validate_tool_result`, which 1.x spells `_validate_tool_result`. An
    # override that binds to nothing is the quiet half of that: no crash, just
    # a broker payload validated by nothing. tests/test_package_shape.py
    # asserts the declared floor here and imports MCPServer, so a floor that
    # slips back below 2.0 reddens rather than ships.
    #
    # No upper bound. The old `<2` existed because 1.x code was pinned under a
    # 2.x break; that reason is spent. What a bound could not do anyway is
    # protect `uvx nakagai-edge`, which resolves fresh at every invocation
    # while this repo and the platform both resolve through a lock: only a
    # release cut against the new major ever proves that path.
    #
    # httpx is this package's own client (PlatformClient, and every test's
    # MockTransport). mcp 2.x brings httpx2 as a separate distribution, and
    # auth.py builds its transport client through the SDK's own
    # create_mcp_http_client, so both live here on purpose.
    "mcp>=2",
    "cryptography>=42",
    "httpx>=0.27",
    "jsonschema>=4.26",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://nakag.ai"
Repository = "https://github.com/loubylabs/nakagai-edge"
Issues = "https://github.com/loubylabs/nakagai-edge/issues"

[project.scripts]
nakagai-edge = "nakagai_edge.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nakagai_edge"]

[tool.hatch.build.targets.sdist]
# What ships is a choice, not whatever happened to be tracked. `tests/` and the
# lockfile earn their place (someone building from source can verify it); agent
# scaffolding and CI config do not.
#
# `.claude` still belongs here after the skills moved into the package. It is
# not gitignored, and an sdist build sweeps in untracked files, so this is what
# keeps a developer's local `.claude/worktrees/` and settings out of a release.
# It reads like dead config now that nothing under it is tracked. It is not.
exclude = [".claude", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
